format = """
[░▒▓](#a3aed2)\
[ 󰣛 ](bg:#a3aed2 fg:#090c0c)\
[](bg:#1a5fb4 fg:#a3aed2)\
$directory\
[](fg:#1a5fb4 bg:#3584e4)\
$git_branch\
$git_status\
[](fg:#3584e4 bg:#212736)\
$nodejs\
$rust\
$golang\
$php\
$java\
$kotlin\
$haskell\
$python\
[](fg:#212736 bg:#1d2230)\
$time\
[ ](fg:#1d2230)\
\n$character"""

[directory]
style = "fg:#e3e5e5 bg:#1a5fb4"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Documentos" = "󰈙 "
"Downloads" = " "
"Descargas" = " "
"Music" = " "
"Música" = " "
"Pictures" = " "
"Imágenes" = " "
"Developer" = "󰲋 "
"Desarrollo" = "󰲋 "
"Dev" = "󰲋 "

[git_branch]
symbol = ""
style = "bg:#394260"
format = '[[ $symbol $branch ](fg:#e3e5e5 bg:#3584e4)]($style)'


[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#e3e5e5 bg:#3584e4)]($style)'

[nodejs]
symbol =  ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[c]
symbol = " "
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
